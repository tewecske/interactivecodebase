name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Check formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Test
        run: make test
      - name: Build
        run: go build ./...

  goweb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned goweb commit
        id: pin
        run: echo "commit=$(jq -r .commit testdata/golden/goweb.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: tewecske/goweb
          ref: ${{ steps.pin.outputs.commit }}
          path: goweb-src
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Golden test against goweb
        run: make test-goweb
        env:
          ICB_GOWEB_DIR: ${{ github.workspace }}/goweb-src
          ICB_GOWEB_REQUIRED: "1"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: hashFiles('ui/package.json') != ''
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        run: make ui
